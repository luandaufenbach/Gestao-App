<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px;background:var(--bg-app)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:var(--type-micro);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-tertiary);width:84px;flex-shrink:0}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.GestaoAppDesignSystem_8ff7d0;
const { TextField, SearchField, Select, Checkbox, Radio, Switch, SegmentedControl, FilterChip, Kbd } = NS;
function Demo(){const [v,setV]=React.useState('list');const [a,setA]=React.useState(true);return (<div className="col">
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}><TextField label="Nome completo" defaultValue="Marina Alves"/><TextField label="E-mail" icon="mail" placeholder="voce@empresa.com.br"/><TextField label="Cargo" icon="user" error="Campo obrigatório"/></div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}><SearchField placeholder="Buscar tarefas, projetos…"/><Select icon="globe" options={['América/São Paulo (GMT-3)','Europa/Lisboa (GMT+1)']}/></div>
<div className="row" style={{gap:20}}><Checkbox shape="round" ariaLabel="Concluir"/><Checkbox shape="round" defaultChecked ariaLabel="Concluída"/><Checkbox shape="round" strike defaultChecked label="Layout da página de preços"/><Checkbox defaultChecked label="Lembretes"/><Checkbox label="Resumo diário"/><Radio name="r" defaultChecked label="Semanal"/><Radio name="r" label="Mensal"/></div>
<div className="row" style={{gap:16}}><Switch defaultChecked ariaLabel="on"/><Switch ariaLabel="off"/><Switch size="sm" defaultChecked label="Menções e comentários"/><SegmentedControl value={v} onChange={setV} options={[{value:'list',label:'Lista',icon:'list'},{value:'board',label:'Quadro',icon:'columns-3'},{value:'calendar',label:'Calendário',icon:'calendar'}]}/></div>
<div className="row"><FilterChip label="Responsável: Eu" icon="user" active={a} onRemove={()=>setA(false)} onClick={()=>setA(true)}/><FilterChip label="Projeto"/><FilterChip label="Prioridade"/><FilterChip label="Prazo" icon="calendar"/></div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
