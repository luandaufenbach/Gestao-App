<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font:var(--type-body)}.k{font:var(--type-micro);color:var(--text-tertiary);font-family:var(--font-mono);font-size:10.5px}.n{font:var(--type-label);color:var(--text-primary)}.w{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pn{border-radius:14px;padding:14px;background:var(--bg-app);display:flex;flex-direction:column;gap:8px}.cd{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;color:var(--text-primary);font:var(--type-body-strong)}.ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-strong)}.mt{color:var(--text-tertiary);font:var(--type-caption);margin-left:auto}.btn{align-self:flex-start;height:30px;padding:0 14px;border-radius:999px;background:var(--brand-primary);color:#fff;display:flex;align-items:center;font:var(--type-label)}</style></head><body><div class="w"><div class="pn" style="box-shadow:inset 0 0 0 1px var(--border-subtle)"><div class="cd"><span class="ck"></span>Finalizar design do site<span class="mt">10:00</span></div><div class="btn">Nova tarefa</div></div><div class="pn" data-theme="dark"><div class="cd"><span class="ck"></span>Finalizar design do site<span class="mt">10:00</span></div><div class="btn">Nova tarefa</div></div></div></body></html>
