<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font:var(--type-body)}.k{font:var(--type-micro);color:var(--text-tertiary);font-family:var(--font-mono);font-size:10.5px}.n{font:var(--type-label);color:var(--text-primary)}.r{display:flex;align-items:flex-end;gap:10px}.s{display:flex;flex-direction:column;align-items:center;gap:6px}.b{background:var(--cobalt-500);border-radius:3px;width:var(--w);height:var(--w)}</style></head><body><div class="r"><div class="s"><div class="b" style="--w:var(--space-0-5)"></div><span class="k">0-5</span></div><div class="s"><div class="b" style="--w:var(--space-1)"></div><span class="k">1</span></div><div class="s"><div class="b" style="--w:var(--space-1-5)"></div><span class="k">1-5</span></div><div class="s"><div class="b" style="--w:var(--space-2)"></div><span class="k">2</span></div><div class="s"><div class="b" style="--w:var(--space-2-5)"></div><span class="k">2-5</span></div><div class="s"><div class="b" style="--w:var(--space-3)"></div><span class="k">3</span></div><div class="s"><div class="b" style="--w:var(--space-3-5)"></div><span class="k">3-5</span></div><div class="s"><div class="b" style="--w:var(--space-4)"></div><span class="k">4</span></div><div class="s"><div class="b" style="--w:var(--space-5)"></div><span class="k">5</span></div><div class="s"><div class="b" style="--w:var(--space-6)"></div><span class="k">6</span></div><div class="s"><div class="b" style="--w:var(--space-8)"></div><span class="k">8</span></div><div class="s"><div class="b" style="--w:var(--space-10)"></div><span class="k">10</span></div><div class="s"><div class="b" style="--w:var(--space-12)"></div><span class="k">12</span></div><div class="s"><div class="b" style="--w:var(--space-16)"></div><span class="k">16</span></div></div></body></html>
