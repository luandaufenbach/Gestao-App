<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="ease-out 140–320ms · spring for done · sheet 420ms — hover to play" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font:var(--type-body)}.k{font:var(--type-micro);color:var(--text-tertiary);font-family:var(--font-mono);font-size:10.5px}.n{font:var(--type-label);color:var(--text-primary)}.r{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.t{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:12px;padding:10px;height:96px;display:flex;flex-direction:column;justify-content:space-between}.tr{height:6px;border-radius:3px;background:var(--ink-100);position:relative}.dt{position:absolute;top:-5px;left:0;width:16px;height:16px;border-radius:50%;background:var(--cobalt-500);transition:left var(--d) var(--e)}.r:hover .dt{left:calc(100% - 16px)}</style></head><body><div class="r"><div class="t"><span class="n">fast 140</span><div class="tr"><div class="dt" style="--d:var(--dur-fast);--e:var(--ease-out)"></div></div><span class="k">ease-out</span></div><div class="t"><span class="n">base 200</span><div class="tr"><div class="dt" style="--d:var(--dur-base);--e:var(--ease-out)"></div></div><span class="k">ease-out</span></div><div class="t"><span class="n">slow 320 spring</span><div class="tr"><div class="dt" style="--d:var(--dur-slow);--e:var(--ease-spring)"></div></div><span class="k">ease-spring</span></div><div class="t"><span class="n">sheet 420</span><div class="tr"><div class="dt" style="--d:var(--dur-sheet);--e:var(--ease-in-out)"></div></div><span class="k">ease-in-out</span></div></div></body></html>
