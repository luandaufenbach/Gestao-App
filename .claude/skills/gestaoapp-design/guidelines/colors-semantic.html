<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font:var(--type-body)}.k{font:var(--type-micro);color:var(--text-tertiary);font-family:var(--font-mono);font-size:10.5px}.n{font:var(--type-label);color:var(--text-primary)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.t{border-radius:10px;padding:10px;height:72px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 1px var(--border-subtle)}.t span{font:var(--type-micro);font-family:var(--font-mono);font-size:10px}</style></head><body><div class="g"><div class="t" style="background:var(--bg-app);color:var(--text-primary)"><b style="font:var(--type-label)">Aa</b><span>--bg-app</span></div><div class="t" style="background:var(--bg-sidebar);color:var(--text-primary)"><b style="font:var(--type-label)">Aa</b><span>--bg-sidebar</span></div><div class="t" style="background:var(--surface-card);color:var(--text-primary)"><b style="font:var(--type-label)">Aa</b><span>--surface-card</span></div><div class="t" style="background:var(--surface-sunken);color:var(--text-secondary)"><b style="font:var(--type-label)">Aa</b><span>--surface-sunken</span></div><div class="t" style="background:var(--surface-selected);color:var(--text-brand)"><b style="font:var(--type-label)">Aa</b><span>--surface-selected</span></div><div class="t" style="background:var(--surface-brand);color:var(--text-on-brand)"><b style="font:var(--type-label)">Aa</b><span>--surface-brand</span></div><div class="t" style="background:var(--surface-accent);color:var(--text-on-accent)"><b style="font:var(--type-label)">Aa</b><span>--surface-accent</span></div><div class="t" style="background:var(--surface-inverse);color:var(--text-inverse)"><b style="font:var(--type-label)">Aa</b><span>--surface-inverse</span></div><div class="t" style="background:var(--feedback-danger-bg);color:var(--feedback-danger)"><b style="font:var(--type-label)">Aa</b><span>--feedback-danger-bg</span></div><div class="t" style="background:var(--feedback-success-bg);color:var(--feedback-success)"><b style="font:var(--type-label)">Aa</b><span>--feedback-success-bg</span></div></div></body></html>
