<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font:var(--type-body)}.k{font:var(--type-micro);color:var(--text-tertiary);font-family:var(--font-mono);font-size:10.5px}.n{font:var(--type-label);color:var(--text-primary)}.w{display:grid;grid-template-columns:1fr 150px;gap:16px}.d{display:grid;grid-template-columns:62px 1fr 92px;gap:6px;height:170px}.d div,.m div{border-radius:8px;display:flex;align-items:flex-end;padding:6px;font:var(--type-micro)}.m{display:flex;flex-direction:column;gap:6px;height:170px;border:1px solid var(--border-default);border-radius:16px;padding:6px}</style></head><body><div class="w"><div class="d"><div style="background:var(--bg-sidebar);box-shadow:inset 0 0 0 1px var(--border-default)">248</div><div style="background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-default)">content · max 1440 · pad 28</div><div style="background:var(--cobalt-50);box-shadow:inset 0 0 0 1px var(--cobalt-200);color:var(--cobalt-600)">drawer 380</div></div><div class="m"><div style="flex:1;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-default)">pad 16</div><div style="height:30px;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-default);justify-content:center;align-items:center">tab bar · <b style="color:var(--cobalt-500);margin-left:3px">+</b></div></div></div></body></html>
