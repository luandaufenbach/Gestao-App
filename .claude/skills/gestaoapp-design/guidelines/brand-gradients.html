<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font:var(--type-body)}.k{font:var(--type-micro);color:var(--text-tertiary);font-family:var(--font-mono);font-size:10.5px}.n{font:var(--type-label);color:var(--text-primary)}.g{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}.g div{height:130px;border-radius:14px;position:relative}.g span{position:absolute;left:10px;bottom:8px;font:var(--type-micro);font-family:var(--font-mono);font-size:10px}</style></head><body><div class="g"><div style="background:var(--image-sky) center/cover"><span style="color:#fff">--image-sky</span></div><div style="background:var(--gradient-cobalt-card)"><span style="color:#fff">--gradient-cobalt-card</span></div><div style="background:var(--gradient-halo),var(--gradient-halo-zest) 40px 20px/120px 120px no-repeat,var(--ink-25);box-shadow:inset 0 0 0 1px var(--border-subtle)"><span>--gradient-halo(-zest)</span></div></div></body></html>
