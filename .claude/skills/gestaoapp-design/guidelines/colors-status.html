<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font:var(--type-body)}.k{font:var(--type-micro);color:var(--text-tertiary);font-family:var(--font-mono);font-size:10.5px}.n{font:var(--type-label);color:var(--text-primary)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.p{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font:var(--type-label)}.d{width:7px;height:7px;border-radius:50%}.sq{width:28px;height:28px;border-radius:8px}</style></head><body><div class="row"><span class="p" style="background:var(--status-todo-bg)"><span class="d" style="background:var(--status-todo)"></span>A fazer</span><span class="p" style="background:var(--status-progress-bg)"><span class="d" style="background:var(--status-progress)"></span>Em andamento</span><span class="p" style="background:var(--status-review-bg)"><span class="d" style="background:var(--status-review)"></span>Em revisão</span><span class="p" style="background:var(--status-done-bg)"><span class="d" style="background:var(--status-done)"></span>Concluída</span></div><div class="row" style="margin-top:14px"><div class="sq" style="background:var(--project-1)" title="--project-1"></div><div class="sq" style="background:var(--project-2)" title="--project-2"></div><div class="sq" style="background:var(--project-3)" title="--project-3"></div><div class="sq" style="background:var(--project-4)" title="--project-4"></div><div class="sq" style="background:var(--project-5)" title="--project-5"></div><div class="sq" style="background:var(--project-6)" title="--project-6"></div><div class="sq" style="background:var(--project-7)" title="--project-7"></div><span class="k" style="margin-left:6px">--project-1 … 7</span></div></body></html>
