<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font:var(--type-body)}.k{font:var(--type-micro);color:var(--text-tertiary);font-family:var(--font-mono);font-size:10.5px}.n{font:var(--type-label);color:var(--text-primary)}.r{display:flex;gap:16px;padding:6px 4px 0}.s{display:flex;flex-direction:column;gap:10px;align-items:center;flex:1}.b{width:100%;height:84px;background:var(--surface-card);border-radius:14px;box-shadow:var(--sh)}</style></head><body><div class="r"><div class="s"><div class="b" style="--sh:var(--shadow-xs)"></div><span class="k">shadow-xs</span></div><div class="s"><div class="b" style="--sh:var(--shadow-sm)"></div><span class="k">shadow-sm</span></div><div class="s"><div class="b" style="--sh:var(--shadow-md)"></div><span class="k">shadow-md</span></div><div class="s"><div class="b" style="--sh:var(--shadow-lg)"></div><span class="k">shadow-lg</span></div><div class="s"><div class="b" style="--sh:var(--shadow-xl)"></div><span class="k">shadow-xl</span></div><div class="s"><div class="b" style="--sh:var(--shadow-brand);background:var(--cobalt-500)"></div><span class="k">shadow-brand</span></div></div></body></html>
