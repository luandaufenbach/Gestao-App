<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Gestão Financeira</title>
		<meta
			name="description"
			content="Controle de gastos, faturas de cartão e metas de reserva, com saldo mensal e histórico por categoria."
		/>

		<!-- O ícone antigo apontava para /vite.svg, arquivo que nunca existiu no
         projeto: a aba ficava com o ícone genérico de página em branco. -->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

		<!--
      Cloud (#FAFBFD), o mesmo canvas do design system. Era #0f172a, o slate do
      visual antigo: a barra de status do celular ficava preta encostada num app
      claro. Precisa continuar igual ao `theme_color` do manifest.
    -->
		<meta name="theme-color" content="#FAFBFD" />

		<!--
      PWA (ROADMAP 4.1). O manifest é injetado pelo vite-plugin-pwa; o que
      precisa ficar aqui é o que o iOS NÃO lê do manifest:

      - `apple-touch-icon`: sem ele o iPhone usa um print da tela como ícone.
      - `apple-mobile-web-app-capable`: é o que faz o app abrir sem a barra do
        Safari. O `display: standalone` do manifest sozinho não basta no iOS.
      - `apple-mobile-web-app-title`: o nome embaixo do ícone; sem ele o iOS usa
        o <title> inteiro, que não cabe.
    -->
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Gestão" />

		<!--
      Preload das duas fontes `latin` (ROADMAP 1.4).

      Só agora faz sentido: na etapa 1.3 as fontes existiam mas nenhuma tela do
      app as usava, então o preload baixaria 2 arquivos que ninguém ia desenhar.
      Com o dashboard e o chrome em Outfit, a fonte entra no caminho crítico do
      primeiro render.

      Só a faixa `latin`: `unicode-range` separa `latin` de `latin-ext` (ver
      `design-system/tokens/fonts.css`), e em pt-BR os acentos e o "ç" estão em
      `latin` — o arquivo `latin-ext` costuma não ser baixado. Precarregá-lo
      seria tráfego jogado fora, e o navegador avisa no console quando um
      recurso precarregado não é usado.

      `crossorigin` é obrigatório mesmo sendo mesma origem: fonte é sempre
      buscada em modo CORS anônimo, e sem o atributo o navegador faz a
      requisição DUAS vezes — uma pelo preload e outra pelo `@font-face`.
    -->
		<link
			rel="preload"
			href="/fonts/Outfit-normal-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/PlusJakartaSans-normal-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<!--
      Open Graph: é isto que WhatsApp, Telegram, Slack e afins leem ao gerar a
      prévia de um link. Sem estas tags o compartilhamento mostrava só o
      <title>, que era "frontend" — o nome padrão que o Vite deixa no template.
    -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Gestão Financeira" />
		<meta property="og:locale" content="pt_BR" />
		<meta property="og:title" content="Gestão Financeira" />
		<meta
			property="og:description"
			content="Controle de gastos, faturas de cartão e metas de reserva, com saldo mensal e histórico por categoria."
		/>
		<meta property="og:url" content="https://gestao-app-web.onrender.com" />
		<meta name="twitter:card" content="summary" />
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
